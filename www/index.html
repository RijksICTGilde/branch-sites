<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alle websites</title>
<link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@nldd/design-system@0.21.1/dist/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nldd/design-system@0.21.1/dist/css/global.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@nldd/design-system@0.21.1/dist/cdn/autoloader.js"></script>
</head>
<body>
<nldd-shell>
  <nldd-page>
    <nldd-simple-section>
      <nldd-title id="titel" size="1" heading-level="1" text="Alle websites"></nldd-title>
      <div id="uitleg" hidden>
        <nldd-spacer size="8"></nldd-spacer>
        <nldd-text color="secondary">Elke branch in de repository is een eigen website. <nldd-link href="/_uitleg/" text="Zo zet je je eigen website erbij"></nldd-link>.</nldd-text>
      </div>
      <nldd-spacer size="24"></nldd-spacer>
      <nldd-search-field id="zoek" placeholder="Zoek op teamnaam, titel of pagina"></nldd-search-field>
      <nldd-spacer size="16"></nldd-spacer>
      <nldd-text id="aantal" size="sm" color="secondary" aria-live="polite"></nldd-text>
      <nldd-spacer size="4"></nldd-spacer>
      <nldd-list id="sites" accessible-label="Websites">
        <nldd-inline-dialog slot="empty" icon="document" text="Nog geen websites" supporting-text="Push een branch naar de repository, dan verschijnt die hier binnen een paar minuten."></nldd-inline-dialog>
        <nldd-inline-dialog slot="no-results" icon="magnifier" text="Geen website gevonden" supporting-text="Pas je zoekopdracht aan."></nldd-inline-dialog>
      </nldd-list>
    </nldd-simple-section>
  </nldd-page>
</nldd-shell>
<script type="module">
  import { discover } from "https://cdn.jsdelivr.net/npm/@nldd/design-system@0.21.1/dist/cdn/autoloader.js";

  // Names, titles and commit messages come from participants: set them as attributes, never as HTML.
  const search = document.getElementById("zoek");
  const list = document.getElementById("sites");
  const count = document.getElementById("aantal");
  const dateFormat = new Intl.DateTimeFormat("nl-NL", { dateStyle: "medium", timeStyle: "short" });
  let query = "";

  function row(site) {
    const item = document.createElement("nldd-list-item");
    item.setAttribute("href", site.path);
    item.dataset.haystack = [site.name, site.title].join(" ").toLowerCase();
    const text = document.createElement("nldd-text-cell");
    text.setAttribute("text", site.title || site.name);
    text.setAttribute("supporting-text", `${site.name} · laatst bijgewerkt op ${dateFormat.format(new Date(site.date))}`);
    const spacer = document.createElement("nldd-spacer-cell");
    spacer.setAttribute("size", "12");
    const chevron = document.createElement("nldd-icon-cell");
    chevron.setAttribute("size", "20");
    chevron.setAttribute("color", "secondary");
    chevron.setAttribute("icon", "chevron-right");
    item.append(text, spacer, chevron);
    return item;
  }

  // A page inside a site. Only shown while searching, right below its site.
  function pageRow(site, page, title) {
    const item = document.createElement("nldd-list-item");
    item.setAttribute("href", site.path + page.split("/").map(encodeURIComponent).join("/"));
    item.dataset.page = "";
    item.dataset.haystack = [site.name, site.title, page, title].join(" ").toLowerCase();
    const text = document.createElement("nldd-text-cell");
    text.setAttribute("text", title || page);
    text.setAttribute("supporting-text", `Pagina van ${site.title || site.name} · ${page}`);
    const spacer = document.createElement("nldd-spacer-cell");
    spacer.setAttribute("size", "12");
    const chevron = document.createElement("nldd-icon-cell");
    chevron.setAttribute("size", "20");
    chevron.setAttribute("color", "secondary");
    chevron.setAttribute("icon", "chevron-right");
    item.append(text, spacer, chevron);
    return item;
  }

  function rows(site) {
    const titles = site.page_titles || {};
    const inner = (site.pages || []).filter(page => page !== "index.html");
    const siteRow = row(site);
    // A site is also found by the titles and names of its inner pages.
    siteRow.dataset.haystack += " " + inner.map(page => `${page} ${titles[page] || ""}`).join(" ").toLowerCase();
    return [siteRow, ...inner.map(page => pageRow(site, page, titles[page]))];
  }

  function applyFilter() {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const items = [...list.querySelectorAll("nldd-list-item")];
    const sites = items.filter(item => !("page" in item.dataset));
    let shownSites = 0;
    let shownPages = 0;
    for (const item of items) {
      const isPage = "page" in item.dataset;
      const match = terms.every(t => item.dataset.haystack.includes(t));
      item.hidden = isPage ? !(terms.length && match) : !match;
      if (!item.hidden) isPage ? shownPages++ : shownSites++;
    }
    const pages = shownPages === 1 ? "1 pagina" : `${shownPages} pagina's`;
    count.textContent = terms.length ? `${shownSites} van ${sites.length} websites, ${pages}` : `${sites.length} websites`;
  }

  async function load() {
    try {
      const res = await fetch("/_index.json", { cache: "no-store" });
      if (!res.ok) return;
      const { sites } = await res.json();
      const items = sites.flatMap(rows);
      // nldd-list breaks on items added before it and nldd-list-item are defined, so load those first.
      const holder = document.createElement("div");
      holder.append(...items);
      await discover(holder);
      await customElements.whenDefined("nldd-list");
      list.querySelectorAll("nldd-list-item").forEach(item => item.remove());
      list.append(...items);
      applyFilter();
    } catch (e) {
      // Keep the current list; the next refresh tries again.
    }
  }

  // The heading can be set with SITE_TITLE, for example to the name of the session. It comes from the
  // environment, not from participants, but goes in as an attribute and as text all the same. The sentence
  // with the link to the explanation page is off unless SHOW_EXPLANATION_LINK is set.
  fetch("/_site.json", { cache: "no-store" })
    .then(res => res.ok ? res.json() : {})
    .then(({ title, explanation_link }) => {
      document.getElementById("uitleg").hidden = !explanation_link;
      if (!title) return;
      document.title = title;
      document.getElementById("titel").setAttribute("text", title);
    })
    .catch(() => {});

  search.addEventListener("input", event => {
    query = event.detail?.value ?? event.target?.value ?? "";
    applyFilter();
  });
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
