worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Runs as an arbitrary non-root UID (OpenShift), so everything writable lives in /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Only what a static website needs. Anything else (zip, exe, dmg, ...) gets the blocked page: participants
    # must not use the demo to hand out files. A path without an extension may be a directory, so it passes.
    map $uri $blocked_type {
        default 1;
        ~/$ 0;
        ~/[^./]+$ 0;
        ~*\.(html?|css|m?js|json|txt|md|xml|webmanifest|map)$ 0;
        ~*\.(png|jpe?g|gif|webp|avif|svg|ico|bmp)$ 0;
        ~*\.(woff2?|ttf|otf)$ 0;
        ~*\.(mp4|webm|mp3|ogg|wav|m4a|vtt)$ 0;
        ~*\.(pdf|csv)$ 0;
    }

    server {
        listen 8080;
        # Behind the authorization wall: a redirect with our own host and port would point past it.
        absolute_redirect off;
        root /tmp/sites;
        index index.html;
        # Sites change all the time during the demo: nothing may be cached. nosniff keeps a browser from running
        # a file as something other than its extension says, like an HTML page committed as image.png.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        etag off;
        if_modified_since off;

        # Ready once the first sync is done, so a woken pod does not serve an empty list.
        location = /healthz {
            try_files /_ready =503;
        }

        location = / {
            root /app/www;
            try_files /index.html =404;
        }

        location ^~ /_uitleg/ {
            root /app/www;
        }

        # Friendly error pages instead of nginx's own. The browser keeps the requested URL, so a page can read
        # from location.pathname what went wrong where.
        error_page 404 /_fout/404.html;
        error_page 500 502 504 /_fout/500.html;

        location ^~ /_fout/ {
            internal;
            root /app/www;
        }

        location ~ /\. {
            return 404;
        }

        # A directory of a site. Without index.html nginx would answer 403; show which pages there are instead.
        location ~ /$ {
            try_files ${uri}index.html @no_index;
        }

        location @no_index {
            if (-d $request_filename) {
                error_page 404 /_fout/geen-index.html;
                return 404;
            }
            return 404;
        }

        # The participants' sites. No CSP sandbox: behind the authorization wall, a sandboxed page loses the
        # SameSite=Lax login cookie on its own CSS, images and fetches.
        location / {
            # Extensionless files (README, LICENSE) show as text instead of being downloaded.
            default_type text/plain;
            # Its own error_page drops the server's, so 404 is repeated.
            error_page 403 /_fout/geblokkeerd.html;
            error_page 404 /_fout/404.html;
            if ($blocked_type) {
                return 403;
            }
            try_files $uri $uri/ =404;
        }
    }
}
