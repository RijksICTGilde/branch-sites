worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Runs as an arbitrary non-root UID (OpenShift), so everything writable lives in /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        # Behind the authorization wall: a redirect with our own host and port would point past it.
        absolute_redirect off;
        root /tmp/sites;
        index index.html;
        # Sites change all the time during the demo: nothing may be cached.
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;

        # Ready once the first sync is done, so a woken pod does not serve an empty list.
        location = /healthz {
            try_files /_ready =503;
        }

        location = / {
            root /app/www;
            try_files /index.html =404;
        }

        location ^~ /_uitleg/ {
            root /app/www;
        }

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
